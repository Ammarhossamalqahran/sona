<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إلى حسناء ❤️</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #050207;
            color: white;
            font-family: "Cairo", sans-serif;
        }


        /* =====================================
           BACKGROUND
        ===================================== */

        .scene {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #050207;
        }


        .background {
            position: absolute;
            inset: -8%;

            background:
                linear-gradient(
                    rgba(5, 2, 7, .48),
                    rgba(5, 2, 7, .88)
                ),
                url("hosnaa.jpg");

            background-size: cover;
            background-position: center;

            filter:
                blur(13px)
                brightness(.50)
                saturate(.80);

            transform: scale(1.08);

            animation:
                backgroundZoom 14s
                ease-in-out
                infinite alternate;
        }


        /* Pink glow */

        .pinkGlow {
            position: absolute;

            width: 75vmax;
            height: 75vmax;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 35, 105, .23),
                    transparent 65%
                );

            animation:
                glowPulse 5s
                ease-in-out
                infinite;
        }


        /* Dark edges */

        .vignette {
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle,
                    transparent 25%,
                    rgba(0, 0, 0, .78) 100%
                );
        }


        /* =====================================
           CONTENT
        ===================================== */

        .content {
            position: relative;

            z-index: 5;

            width: min(900px, 90%);

            text-align: center;

            animation:
                pageEnter 2s
                cubic-bezier(.2, .8, .2, 1)
                both;
        }


        .smallTitle {
            color: #f2c8d4;

            font-size: 12px;

            letter-spacing: 7px;

            margin-bottom: 25px;

            opacity: .85;
        }


        /* =====================================
           HOSNAA NAME
        ===================================== */

        .name {

            font-family: "Amiri", serif;

            font-size:
                clamp(95px, 20vw, 220px);

            font-weight: 400;

            line-height: .75;

            background:
                linear-gradient(
                    120deg,
                    #ffffff 10%,
                    #ffd8e2 45%,
                    #ff3972 90%
                );

            -webkit-background-clip: text;

            color: transparent;

            text-shadow:
                0 0 70px
                rgba(255, 40, 100, .18);

            animation:
                nameReveal 2.5s
                .3s
                both;
        }


        /* =====================================
           LINE
        ===================================== */

        .line {

            width: 0;

            height: 1px;

            margin:
                42px
                auto
                25px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff779b,
                    transparent
                );

            animation:
                lineReveal 1.5s
                1.1s
                forwards;
        }


        /* =====================================
           TYPING MESSAGE
        ===================================== */

        .message {

            font-family: "Amiri", serif;

            font-size:
                clamp(19px, 3vw, 29px);

            line-height: 1.9;

            color: #f8e9ee;

            min-height: 60px;
        }


        .cursor {

            display: inline-block;

            width: 2px;

            height: 1em;

            background: #ff7898;

            margin-right: 5px;

            vertical-align: -2px;

            animation:
                blink .7s infinite;
        }


        /* =====================================
           BIRTHDAY
        ===================================== */

        .birthday {

            margin-top: 24px;

            color: #d9aebb;

            font-size: 13px;

            letter-spacing: 2px;

            opacity: 0;

            animation:
                birthdayAppear 1s
                3.8s
                forwards;
        }


        .birthday span {

            color: #ff789b;

            font-weight: 700;
        }


        /* =====================================
           BUTTON
        ===================================== */

        .openButton {

            margin-top: 34px;

            padding:
                14px
                32px;

            border-radius: 999px;

            border:
                1px solid
                rgba(255, 255, 255, .25);

            background:
                rgba(255, 255, 255, .055);

            color: white;

            font-family: Cairo;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            backdrop-filter: blur(12px);

            transition:
                .35s;

            opacity: 0;

            animation:
                buttonAppear 1s
                4.3s
                forwards;
        }


        .openButton:hover {

            transform:
                translateY(-4px)
                scale(1.04);

            background:
                rgba(255, 40, 100, .16);

            box-shadow:
                0 0 40px
                rgba(255, 40, 100, .25);
        }


        /* =====================================
           BOTTOM TEXT
        ===================================== */

        .bottomText {

            position: absolute;

            bottom: 28px;

            z-index: 6;

            font-size: 10px;

            letter-spacing: 3px;

            color: #d8b8c1;

            opacity: .55;

            animation:
                floating 2.2s
                ease-in-out
                infinite;
        }


        /* =====================================
           FLOATING HEARTS
        ===================================== */

        .hearts {

            position: absolute;

            inset: 0;

            pointer-events: none;

            z-index: 3;

            overflow: hidden;
        }


        .heart {

            position: absolute;

            bottom: -30px;

            color: #ff7198;

            opacity: 0;

            animation:
                heartRise
                linear
                forwards;
        }


        /* =====================================
           TRANSITION
        ===================================== */

        .transition {

            position: absolute;

            inset: 0;

            background: #050207;

            z-index: 20;

            display: flex;

            align-items: center;

            justify-content: center;

            opacity: 0;

            pointer-events: none;
        }


        .transition.active {

            animation:
                transitionAnimation
                1.6s
                forwards;
        }


        .transition h2 {

            font-family: "Amiri", serif;

            font-size:
                clamp(40px, 9vw, 90px);

            font-weight: 400;

            color: #ff7699;
        }


        /* =====================================
           ANIMATIONS
        ===================================== */

        @keyframes backgroundZoom {

            from {
                transform: scale(1.08);
            }

            to {
                transform: scale(1.16);
            }

        }


        @keyframes glowPulse {

            50% {
                transform: scale(1.15);
                opacity: .7;
            }

        }


        @keyframes pageEnter {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        @keyframes nameReveal {

            from {
                opacity: 0;

                transform:
                    scale(.88);

                filter:
                    blur(15px);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);

                filter:
                    blur(0);
            }

        }


        @keyframes lineReveal {

            to {
                width:
                    min(430px, 65vw);
            }

        }


        @keyframes blink {

            50% {
                opacity: 0;
            }

        }


        @keyframes birthdayAppear {

            to {
                opacity: .85;
            }

        }


        @keyframes buttonAppear {

            to {
                opacity: 1;
            }

        }


        @keyframes floating {

            50% {
                transform:
                    translateY(-7px);

                opacity: .85;
            }

        }


        @keyframes heartRise {

            0% {

                transform:
                    translateY(10vh)
                    scale(.4)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: .55;
            }

            100% {

                transform:
                    translateY(-110vh)
                    scale(1.2)
                    rotate(180deg);

                opacity: 0;
            }

        }


        @keyframes transitionAnimation {

            0% {
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            75% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 600px) {

            .smallTitle {
                letter-spacing: 4px;
            }

            .name {
                font-size: 115px;
            }

            .message {
                font-size: 22px;
            }

            .birthday {
                font-size: 11px;
            }

        }

    </style>
</head>


<body>


<div class="scene">

    <!-- الصورة بتاعة حسناء في الخلفية -->
    <div class="background"></div>

    <!-- إضاءة -->
    <div class="pinkGlow"></div>

    <!-- تغميق الأطراف -->
    <div class="vignette"></div>


    <!-- المحتوى -->

    <div class="content">

        <div class="smallTitle">
            A LITTLE STORY WRITTEN FOR
        </div>


        <div class="name">
            حسناء
        </div>


        <div class="line"></div>


        <div class="message">

            <span id="typing"></span>

            <span class="cursor"></span>

        </div>


        <!-- تاريخ ميلادها -->

        <div class="birthday">

            18 • 07 • 2009

            <br>

            <span>
                اليوم اللي اتولدت فيه واحدة مميزة ❤️
            </span>

        </div>


        <button
            class="openButton"
            onclick="openStory()">

            افتحي الحكاية يا حسناء ❤️

        </button>

    </div>


    <!-- قلوب -->

    <div
        class="hearts"
        id="hearts">
    </div>


    <!-- أسفل الشاشة -->

    <div class="bottomText">

        MADE WITH LOVE • FOR HOSNAA

    </div>


    <!-- الانتقال -->

    <div
        class="transition"
        id="transition">

        <h2>
            ولسه الحكاية بتبدأ...
        </h2>

    </div>

</div>



<script>


/* =====================================
   TYPING EFFECT
===================================== */

const text =
"بعض الأشخاص لا يدخلون حياتنا صدفة... بل يتركون في القلب شيئًا لا يزول.";

const typing =
document.getElementById("typing");

let index = 0;


function typeText() {

    if (index < text.length) {

        typing.textContent +=
            text[index];

        index++;

        setTimeout(
            typeText,
            55
        );

    }

}


/* يبدأ بعد ظهور الاسم */

setTimeout(
    typeText,
    1900
);



/* =====================================
   FLOATING HEARTS
===================================== */

const hearts =
document.getElementById("hearts");


const symbols = [
    "♥",
    "♡",
    "✦",
    "♥",
    "♡"
];


function createHeart() {

    const heart =
        document.createElement("div");


    heart.className =
        "heart";


    heart.textContent =
        symbols[
            Math.floor(
                Math.random()
                * symbols.length
            )
        ];


    heart.style.left =
        Math.random() * 100 + "vw";


    heart.style.fontSize =
        (10 + Math.random() * 18)
        + "px";


    heart.style.animationDuration =
        (5 + Math.random() * 7)
        + "s";


    hearts.appendChild(
        heart
    );


    setTimeout(
        () => heart.remove(),
        13000
    );

}


/* قلب جديد كل شوية */

setInterval(
    createHeart,
    450
);



/* =====================================
   OPEN STORY
===================================== */

function openStory() {

    const transition =
        document.getElementById(
            "transition"
        );


    transition.classList.add(
        "active"
    );


    /*
       هنا بعدين هنخليها تروح
       للصفحة التانية من الحكاية
    */

    setTimeout(() => {

        window.location.href =
            "story.html";

    }, 1200);

}

</script>


</body>
</html>
